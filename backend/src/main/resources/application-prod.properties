# Production profile — activated via SPRING_PROFILES_ACTIVE=prod in the ConfigMap
# All sensitive values are injected as environment variables from Kubernetes Secrets.

# ── DataSource (PostgreSQL) ────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Actuator Health Probes (used by liveness/readiness probes) ────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ── File Upload Configuration ──────────────────────────────────────────────────
# Allow uploads up to 10MB (JTL and Gatling result files)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

