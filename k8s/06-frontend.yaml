apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfx-frontend
  namespace: perfx
  labels:
    app: perfx-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: perfx-frontend
  template:
    metadata:
      labels:
        app: perfx-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/perfx-frontend:latest   # ← replace with your image
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: perfx-frontend
  namespace: perfx
  labels:
    app: perfx-frontend
spec:
  selector:
    app: perfx-frontend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
