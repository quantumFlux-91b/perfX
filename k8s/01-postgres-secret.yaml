# Secret for PostgreSQL credentials.
# In production, use Sealed Secrets, Vault, or OpenShift Secrets management
# instead of storing plain values here.
# Values below are base64-encoded: echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: perfx-postgres-secret
  namespace: perfx
type: Opaque
data:
  # echo -n 'perfx' | base64  → cGVyZng=
  POSTGRES_DB:       cGVyZng=
  # echo -n 'perfx' | base64
  POSTGRES_USER:     cGVyZng=
  # echo -n 'changeme' | base64  ← CHANGE THIS before deploying
  POSTGRES_PASSWORD: Y2hhbmdlbWU=
