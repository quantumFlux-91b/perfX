apiVersion: v1
kind: ConfigMap
metadata:
  name: perfx-backend-config
  namespace: perfx
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/perfx"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  SERVER_PORT: "8080"
  # Allow CORS from the frontend service
  CORS_ALLOWED_ORIGINS: "http://perfx-frontend:8080"
