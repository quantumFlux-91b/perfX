apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfx-backend
  namespace: perfx
  labels:
    app: perfx-backend
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: perfx-backend
  template:
    metadata:
      labels:
        app: perfx-backend
    spec:
      # Wait for Postgres to be ready before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2;
              done
      containers:
        - name: backend
          image: your-registry/perfx-backend:latest   # ← replace with your image
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: perfx-backend-config
          env:
            # Credentials injected from Secret (not ConfigMap)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: perfx-postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: perfx-postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: perfx-backend
  namespace: perfx
  labels:
    app: perfx-backend
spec:
  selector:
    app: perfx-backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
