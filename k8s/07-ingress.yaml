# Standard Kubernetes Ingress — works with nginx-ingress-controller
# For OpenShift, use the Route in 08-openshift-route.yaml instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: perfx-ingress
  namespace: perfx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # Uncomment below for TLS termination via cert-manager:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # tls:
  #   - hosts:
  #       - perfx.example.com
  #     secretName: perfx-tls
  rules:
    - host: perfx.example.com    # ← replace with your domain
      http:
        paths:
          # Frontend — all paths
          - path: /
            pathType: Prefix
            backend:
              service:
                name: perfx-frontend
                port:
                  number: 8080
          # Backend API — /api/* proxied to the Spring Boot service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: perfx-backend
                port:
                  number: 8080
